# Shop zwischen den Rennen. typ:
#   level      - dauerhaft, mehrere Stufen (kosten pro Stufe)
#   verbrauch  - wird fuer das naechste Rennen verbraucht
#   tierup     - hebt die Stufe eines Ausruestungs-Slots an (Preis steht in 'preise' je Zielstufe)
upgrades:
  - id: kraftraum
    name: Kraftraum
    icon: "🏋️"
    typ: level
    beschreibung: Senkt die Fehlerchance dauerhaft um 2 Prozentpunkte pro Stufe.
    kosten: [30, 45, 60]
    wirkung: { fehler: -0.02 }
  - id: windkanal
    name: Windkanal-Training
    icon: "🌬️"
    typ: level
    beschreibung: +1 % Geschwindigkeit pro Stufe.
    kosten: [40, 60, 90]
    wirkung: { speed: 0.01 }
  - id: wachs
    name: Rennwachs
    icon: "🕯️"
    typ: verbrauch
    beschreibung: +2 % Geschwindigkeit im nächsten Rennen.
    kosten: 15
    wirkung: { speed: 0.02 }
  - id: besichtigung
    name: Streckenbesichtigung
    icon: "🔍"
    typ: verbrauch
    beschreibung: Verhindert den ersten Fehler im nächsten Rennen.
    kosten: 25
    wirkung: { fehler_block: 1 }
  - id: tierup
    name: Ausrüstungs-Upgrade
    icon: "⬆️"
    typ: tierup
    beschreibung: Hebt einen Ausrüstungs-Slot (außer Athlet) eine Stufe an.
    preise: { standard: 30, profi: 55, legende: 100 }
