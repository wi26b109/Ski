<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Skirennspiel</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#eef4f9;--card:#fff;--ink:#12263a;--mute:#5d7286;--line:#d3dfea;--blue:#1f6fe0;--red:#c8372d;--ok:#1d8a4e}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1a27;--card:#152535;--ink:#e8f0f7;--mute:#93a7ba;--line:#26394c;--blue:#5aa2ff;--red:#ff7a70;--ok:#5fd394}}
:root[data-theme="dark"]{--bg:#0d1a27;--card:#152535;--ink:#e8f0f7;--mute:#93a7ba;--line:#26394c;--blue:#5aa2ff;--red:#ff7a70;--ok:#5fd394}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*:before,*:after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Archivo,system-ui,Arial,sans-serif}
main{max-width:720px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:34px;font-weight:800;margin:8px 0 2px;letter-spacing:-.5px}
h2{font-size:18px;margin:0 0 12px}
.sub{color:var(--mute);margin:0 0 20px}
.gate{height:6px;background:var(--blue);border-radius:3px;margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
label{display:block;font-size:14px;color:var(--mute)}
input,select{width:100%;margin-top:4px;padding:9px 10px;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px}
.full{grid-column:1/-1}
.chk{display:flex;gap:8px;align-items:center}.chk input{width:auto;margin:0}
button{font:inherit;font-weight:600;padding:11px 18px;border-radius:6px;border:0;background:var(--blue);color:#fff;cursor:pointer}
button.ghost{background:none;color:var(--mute);border:1px solid var(--line);font-weight:400;padding:6px 12px}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.time{font-size:44px;font-weight:800;margin:0}
.fail{color:var(--red)}.good{color:var(--ok)}
ul{margin:8px 0 0;padding-left:20px;color:var(--mute)}
.wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:14px;color:var(--mute);font-weight:600}
</style>
</head>
<body>
<main>
<div class="gate"></div>
<h1>Skirennspiel</h1>
<p class="sub">Wähle Ausrüstung und Fitness, starte das Rennen und sieh deine Zeit.</p>

<section class="card">
<h2>Fahrer und Ausrüstung</h2>
<div class="grid">
<label class="full">Name<input id="name" value="Anna" maxlength="20"></label>
<label>Helm<select id="helm"><option value="keiner">keiner</option><option value="anfaenger">Anfänger</option><option value="standard">Standard</option><option value="profi" selected>Profi</option></select></label>
<label>Brille<select id="brille"><option value="keine">keine</option><option value="anfaenger">Anfänger</option><option value="standard">Standard</option><option value="profi" selected>Profi</option></select></label>
<label>Ski<select id="ski"><option value="anfaenger">Anfänger</option><option value="standard">Standard</option><option value="profi" selected>Profi</option></select></label>
<label>Fitness<select id="fitness"><option value="anfaenger">Anfänger</option><option value="standard">Standard</option><option value="profi" selected>Profi</option></select></label>
<label>Länge der Piste (m)<input id="laenge" type="number" min="100" value="2000"></label>
<label>Basisgeschwindigkeit (m/s)<input id="speed" type="number" min="1" value="20"></label>
<label class="full chk"><input id="zufall" type="checkbox">Zufallsereignisse einbauen (optional: Tor verpasst, perfekte Linie ...)</label>
</div>
<p><button id="go">Rennen starten</button></p>
</section>

<section class="card" id="result" aria-live="polite">
<h2>Ergebnis</h2>
<p class="sub" style="margin:0">Noch kein Rennen gefahren.</p>
</section>

<section class="card">
<h2>Highscore-Tabelle</h2>
<div class="wrap"><table>
<thead><tr><th>Platz</th><th>Name</th><th>Zeit</th><th>Ausrüstung</th></tr></thead>
<tbody id="hs"></tbody></table></div>
<p style="margin:12px 0 0"><button class="ghost" id="reset">Highscores löschen</button></p>
</section>
</main>

<script>
// Wertetabelle: null = Ausfall (blaue Markierung)
const STUFEN = {anfaenger:0.90, standard:1.00, profi:1.05};
const FAKTOREN = {
  helm:{keiner:null, ...STUFEN},
  brille:{keine:null, ...STUFEN},
  ski:{...STUFEN},
  fitness:{...STUFEN}
};
const FEHLERCHANCE = {anfaenger:0.30, standard:0.20, profi:0.10};
const EREIGNISSE = [["Tor verpasst",3],["Ausrutscher",2],["Kurve zu weit",1],["Zu späte Kurve",2],["Perfekte Linie",-1],["Kein Fehler",0]];
const KEY = "skirennspiel-highscores";
const $ = id => document.getElementById(id);

function berechne(s, strecke, mitZufall){
  const helm = FAKTOREN.helm[s.helm], brille = FAKTOREN.brille[s.brille];
  if (helm === null || brille === null) return {ausfall:true};
  const v = strecke.speed * helm * brille * FAKTOREN.ski[s.ski] * FAKTOREN.fitness[s.fitness];
  let zeit = strecke.laenge / v;
  const grund = zeit, ereignisse = [];
  if (mitZufall){
    const chanceFehler = FEHLERCHANCE[s.fitness];
    const n = 3 + Math.floor(Math.random()*4);
    for (let i=0;i<n;i++){
      const [name,diff] = EREIGNISSE[Math.floor(Math.random()*EREIGNISSE.length)];
      const chance = diff > 0 ? chanceFehler : 1 - chanceFehler;
      if (diff === 0 || Math.random() <= chance){ zeit += diff; ereignisse.push([name,diff]); }
    }
  }
  return {ausfall:false, v, grund, zeit, ereignisse};
}

function laden(){ try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch(e){ return []; } }
function speichern(l){ try { localStorage.setItem(KEY, JSON.stringify(l)); } catch(e){} }
let liste = laden();

function esc(t){ return String(t).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
const fmt = x => x.toFixed(2).replace(".", ",");

function zeigeHighscore(neu){
  const body = $("hs");
  if (!liste.length){ body.innerHTML = '<tr><td colspan="4">Noch keine Einträge. Fahre ein Rennen.</td></tr>'; return; }
  body.innerHTML = liste.map((e,i) =>
    `<tr${e.id===neu?' style="font-weight:800"':''}><td>${i+1}</td><td>${esc(e.name)}</td><td>${fmt(e.zeit)} s</td><td>${esc(e.info)}</td></tr>`).join("");
}

$("go").onclick = () => {
  const s = {name:$("name").value.trim() || "Spieler", helm:$("helm").value, brille:$("brille").value, ski:$("ski").value, fitness:$("fitness").value};
  const strecke = {laenge:Math.max(100, +$("laenge").value || 2000), speed:Math.max(1, +$("speed").value || 20)};
  const r = berechne(s, strecke, $("zufall").checked);
  const box = $("result");
  if (r.ausfall){
    const fehlt = [s.helm==="keiner"?"Helm":"", s.brille==="keine"?"Brille":""].filter(Boolean).join(" und ");
    box.innerHTML = `<h2>Ergebnis</h2><p class="time fail">Ausfall</p><p>${esc(s.name)} fährt ohne ${fehlt} über die blaue Markierung. Wähle ${fehlt} und starte neu. Ausfälle kommen nicht in die Highscore-Tabelle.</p>`;
    return;
  }
  const zeit = Math.round(r.zeit*100)/100;
  const ev = r.ereignisse.length
    ? "<ul>" + r.ereignisse.map(([n,d]) => `<li>${esc(n)}: ${d>0?"+":""}${d} s</li>`).join("") + "</ul>" : "";
  box.innerHTML = `<h2>Ergebnis für ${esc(s.name)}</h2><p class="time good">${fmt(zeit)} s</p>
    <p>Geschwindigkeit ${fmt(r.v)} m/s, Grundzeit ${fmt(r.grund)} s${$("zufall").checked ? ", danach Zufallsereignisse:" : "."}</p>${ev}`;
  const id = Date.now();
  liste.push({id, name:s.name, zeit, info:`${s.helm}, ${s.brille}, ${s.ski}, ${s.fitness}`});
  liste.sort((a,b) => a.zeit - b.zeit);
  liste = liste.slice(0,10);
  speichern(liste);
  zeigeHighscore(id);
};

$("reset").onclick = () => { liste = []; speichern(liste); zeigeHighscore(); };
zeigeHighscore();
</script>
</body>
</html>
